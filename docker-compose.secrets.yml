# Optional override: read credentials from files instead of environment
# variables, so they do not appear in `docker inspect` or the Portainer stack.
#
#   mkdir -p secrets && chmod 700 secrets
#   printf '%s' 'ghp_...'  > secrets/github_token
#   printf '%s' '<key>'    > secrets/secret_key      # python -m spark.api generate-key
#   printf '%s' '<12+ chars>' > secrets/admin_password
#   docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d --build
#
# Files stay on the host (git-ignored). Back up secret_key separately from the
# database backups: the key is what makes saved tokens readable.

secrets:
  github_token:
    file: ./secrets/github_token
  secret_key:
    file: ./secrets/secret_key
  admin_password:
    file: ./secrets/admin_password

services:
  worker:
    secrets: [github_token, secret_key]
    environment:
      GITHUB_TOKEN: ""
      GITHUB_TOKEN_FILE: /run/secrets/github_token
      SPARK_SECRET_KEY: ""
      SPARK_SECRET_KEY_FILE: /run/secrets/secret_key

  api:
    secrets: [github_token, secret_key, admin_password]
    environment:
      GITHUB_TOKEN: ""
      GITHUB_TOKEN_FILE: /run/secrets/github_token
      SPARK_SECRET_KEY: ""
      SPARK_SECRET_KEY_FILE: /run/secrets/secret_key
      SPARK_ADMIN_PASSWORD: ""
      SPARK_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
