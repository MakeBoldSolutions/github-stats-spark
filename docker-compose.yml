# GitHub Stats Spark - self-hosted stack.
#
#   docker compose up -d --build     # dashboard on port 8086 + scheduled worker
#
# The worker collects on a schedule (SPARK_REFRESH_INTERVAL), publishes each
# run atomically, and writes data/status.json shown in the dashboard header.
#
# Collected data lives in named volumes, separate from configuration:
#   spark-data / spark-output  - generated JSON and reports (rebuildable)
#   spark-cache                - GitHub API cache
#   spark-config               - config/spark.yml (seeded from the image on first start)

name: github-stats-spark

services:
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: github-stats-spark-web:local
    ports:
      # Defaults to this machine only. On the home server set BIND_ADDRESS=192.168.1.197.
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8086}:8080"
    volumes:
      - spark-data:/usr/share/nginx/html/data:ro
      - spark-output:/usr/share/nginx/html/output:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    image: github-stats-spark-worker:local
    # Long-running scheduler. Collects on start (SPARK_RUN_ON_START) and then
    # every SPARK_REFRESH_INTERVAL. To force a run now, restart this container.
    restart: unless-stopped
    command: ["python", "-m", "spark.worker"]
    environment:
      SPARK_USER: ${SPARK_USER:?Set SPARK_USER to the GitHub user(s) to analyze, comma separated}
      SPARK_REFRESH_INTERVAL: ${SPARK_REFRESH_INTERVAL:-6h}
      SPARK_RUN_ON_START: ${SPARK_RUN_ON_START:-true}
      SPARK_RUN_TIMEOUT: ${SPARK_RUN_TIMEOUT:-2h}
      SPARK_RETRY_DELAY: ${SPARK_RETRY_DELAY:-30m}
      SPARK_MIN_RATE_REMAINING: ${SPARK_MIN_RATE_REMAINING:-300}
      # Extra `spark unified` flags, e.g. --include-ai-summaries (needs ANTHROPIC_API_KEY; costs money).
      SPARK_EXTRA_ARGS: ${SPARK_EXTRA_ARGS:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_TOKEN_FILE: ${GITHUB_TOKEN_FILE:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SPARK_CACHE_DIR: /app/.cache
      SPARK_DB_PATH: /app/config/registry.db
      SPARK_SECRET_KEY: ${SPARK_SECRET_KEY:-}
      SPARK_SECRET_KEY_FILE: ${SPARK_SECRET_KEY_FILE:-}
    volumes:
      - spark-data:/app/data
      - spark-output:/app/output
      - spark-cache:/app/.cache
      - spark-config:/app/config
    healthcheck:
      test: ["CMD", "python", "-m", "spark.worker", "--healthcheck"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3
    security_opt:
      - no-new-privileges:true

  # Admin API: sign-in, source management, refresh requests. Not published on
  # a host port; the web container proxies /api to it, so it is exactly as
  # reachable as the dashboard (LAN only).
  api:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    image: github-stats-spark-worker:local
    restart: unless-stopped
    entrypoint: []
    command: ["python", "-m", "spark.api", "serve", "--port", "8000"]
    environment:
      SPARK_DB_PATH: /app/config/registry.db
      # Creates the first administrator if none exists; ignored afterwards.
      SPARK_ADMIN_USER: ${SPARK_ADMIN_USER:-}
      SPARK_ADMIN_PASSWORD: ${SPARK_ADMIN_PASSWORD:-}
      SPARK_ADMIN_PASSWORD_FILE: ${SPARK_ADMIN_PASSWORD_FILE:-}
      # Fernet key that encrypts stored tokens. Keep it outside the database.
      SPARK_SECRET_KEY: ${SPARK_SECRET_KEY:-}
      SPARK_SECRET_KEY_FILE: ${SPARK_SECRET_KEY_FILE:-}
      SPARK_COOKIE_SECURE: ${SPARK_COOKIE_SECURE:-false}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_TOKEN_FILE: ${GITHUB_TOKEN_FILE:-}
    volumes:
      - spark-config:/app/config
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    security_opt:
      - no-new-privileges:true

volumes:
  spark-data:
  spark-output:
  spark-cache:
  spark-config:
