<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- T011 ✓ viewport-fit=cover enables iOS safe area support (notch handling) -->
    <meta name="theme-color" content="#982407" />
    <link rel="canonical" href="https://github-stats.makeboldspark.com/" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="GitHubSpark" />
    
    <!-- Discover dashboard data before the application bundle finishes loading. -->
    <script>
      const selectedUser = new URLSearchParams(location.search).get("user")?.trim().toLowerCase() || "makeboldsolutions";
      const dataPreload = document.createElement("link");
      dataPreload.rel = "preload";
      dataPreload.as = "fetch";
      dataPreload.crossOrigin = "anonymous";
      dataPreload.href = `/data/users/${encodeURIComponent(selectedUser)}/repositories.json`;
      document.head.append(dataPreload);
      const avatarPreload = document.createElement("link");
      avatarPreload.rel = "preload";
      avatarPreload.as = "image";
      avatarPreload.fetchPriority = "high";
      avatarPreload.href = `https://avatars.githubusercontent.com/${encodeURIComponent(selectedUser)}?s=192`;
      document.head.append(avatarPreload);
    </script>

    <!-- Critical CSS for mobile-first (inline for faster FCP) -->
    <style>
      /* Mobile-first critical styles */
      :root {
        --touch-target-min: 44px;
        --safe-area-top: env(safe-area-inset-top, 0px);
        --safe-area-bottom: env(safe-area-inset-bottom, 0px);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 0;
        padding-top: var(--safe-area-top);
        padding-bottom: var(--safe-area-bottom);
        background: #f8f6f2;
        font-family: "Inter Tight", system-ui, -apple-system, sans-serif;
        overflow-x: hidden;
        overscroll-behavior-y: contain;
      }
      .touch-target {
        min-width: var(--touch-target-min);
        min-height: var(--touch-target-min);
      }
    </style>

    <!-- Primary Meta Tags -->
    <title>GitHubSpark — Make Bold Solutions Repository Portfolio</title>
    <meta name="title" content="GitHubSpark — Make Bold Solutions Repository Portfolio" />
    <meta name="description" content="Explore Make Bold Solutions' public GitHub repositories — an AI-powered analytics dashboard showcasing .NET, React, Python, and more." />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://github-stats.makeboldspark.com" />
    <meta property="og:title" content="GitHubSpark — Make Bold Solutions Repository Portfolio" />
    <meta property="og:description" content="Explore Make Bold Solutions' public GitHub repositories — an AI-powered analytics dashboard showcasing .NET, React, Python, and more." />
    <meta property="og:image" content="https://github-stats.makeboldspark.com/favicon.svg" />
    <meta property="og:image:alt" content="GitHubSpark Logo" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://github-stats.makeboldspark.com" />
    <meta property="twitter:title" content="GitHubSpark — Make Bold Solutions Repository Portfolio" />
    <meta property="twitter:description" content="Explore Make Bold Solutions' public GitHub repositories — an AI-powered analytics dashboard showcasing .NET, React, Python, and more." />
    <meta property="twitter:image" content="https://github-stats.makeboldspark.com/favicon.svg" />

    <!-- Preconnect to improve performance -->
    <link rel="preconnect" href="https://api.github.com" />

    <!-- GitHub Pages Base URL Configuration -->
    <!-- This is automatically handled by Vite's base config -->
  </head>
  <body>
    <!-- Root element for React application -->
    <div id="root"></div>

    <!-- Vite will inject the bundled JavaScript here -->
    <script type="module" src="/src/main.jsx"></script>

    <!-- Fallback message for browsers with JavaScript disabled -->
    <noscript>
      <div style="padding: 2rem; text-align: center; font-family: system-ui, sans-serif;">
        <h1>JavaScript Required</h1>
        <p>This application requires JavaScript to be enabled in your browser.</p>
        <p>Please enable JavaScript and refresh the page to view the GitHub Stats Spark Dashboard.</p>
      </div>
      <footer style="text-align:center;padding:1rem;font-size:0.8rem;font-family:system-ui,sans-serif;">
        <p>
          <a href="https://github-stats.makeboldspark.com">GitHubStatsSpark</a> —
          built by <a href="https://markhazleton.com">Mark Hazleton</a> ·
          <a href="https://makeboldsolutions.com">Make Bold Solutions</a>
        </p>
      </footer>
    </noscript>
  </body>
</html>
